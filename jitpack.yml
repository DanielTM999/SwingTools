jdk:
  - openjdk21

before_install:
  - sdk update || true
  - sdk install java 25-open
  - sdk use java 25-open
  - sdk install maven 3.9.9 || sdk install maven 3.9.9 || true
  - sdk use maven 3.9.9 || true

install:
  - MVN="$HOME/.sdkman/candidates/maven/current/bin/mvn"; [ -x "$MVN" ] || MVN="$(command -v mvn)"; "$MVN" -v; "$MVN" -B install -DskipTests -Dnative.build.skip=true
