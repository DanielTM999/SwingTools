jdk:
  - openjdk21

before_install:
  - git config --global --add safe.directory /build
  - for attempt in 1 2 3 4; do if sdk install java 25-open && test -x "$HOME/.sdkman/candidates/java/25-open/bin/java"; then break; fi; if [ "$attempt" -eq 4 ]; then exit 1; fi; sleep 5; done
  - sdk use java 25-open

install:
  - for attempt in 1 2 3 4; do if sh ./mvnw -v; then break; fi; if [ "$attempt" -eq 4 ]; then exit 1; fi; sleep 5; done
  - sh ./mvnw -B install -DskipTests -Dnative.build.skip=true
